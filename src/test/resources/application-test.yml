spring:
  datasource:
    url: jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: PUBLIC
  sql:
    init:
      mode: never

stripe:
  api-key: test_key
  webhook-secret: test_secret
  success-url: http://localhost:5173/success
  cancel-url: http://localhost:5173/cancel
  default-currency: usd
