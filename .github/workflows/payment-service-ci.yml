name: payment-service-ci

on:
  push:
    paths:
      - "paymentService/**"
  pull_request:
    paths:
      - "paymentService/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paymentService
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B clean test

  snyk-sast:
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ secrets.SNYK_TOKEN != '' }}
    defaults:
      run:
        working-directory: paymentService
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Snyk test
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
